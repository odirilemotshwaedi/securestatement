# Spring Application Configurations
spring.security.user.name=user
spring.security.user.password=password

# PostgreSQL Database Connection Settings (Told to look at env variables first)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securestatement_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Schema Management Configurations
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Force Flyway's custom configuration engine to use the correct container URL
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securestatement_db}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:postgres}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:password}

# Explicitly tell Spring Boot to reuse your main configuration datasource pool for migrations
spring.flyway.clear-checksums=false


# Swagger Documentation Configs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Statement PDF storage directory (override via STATEMENT_STORAGE_DIR env var)
statement.storage-dir=${STATEMENT_STORAGE_DIR:${java.io.tmpdir}/secure-statements}

# Development diagnostics — expose error messages in the response body
server.error.include-message=always
server.error.include-binding-errors=always
